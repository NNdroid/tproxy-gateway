name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional expected tag: v1.0.yyyyMMdd.commitCount-7charHash (blank = automatic)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run Unit Tests
        run: |
          bash scripts/version.test.sh
          go test -count=1 -timeout=120s -v ./...

      - name: Determine Version
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            EXPECTED_TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            EXPECTED_TAG="${GITHUB_REF_NAME}"
          else
            EXPECTED_TAG=""
          fi
          TAG="$(bash scripts/version.sh "$EXPECTED_TAG")"
          COMMIT="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$COMMIT"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "Building $COMMIT as $TAG"

      - name: Build and Verify Release Binaries
        run: |
          bash scripts/build.sh "$RELEASE_TAG"
          test "$(./bin/tproxy-gateway-linux-amd64-v1 --version)" = "$RELEASE_TAG"
          mkdir -p release_assets
          cp bin/* release_assets/
          cd release_assets
          sha256sum * > checksums.txt
          sha256sum -c checksums.txt
          ls -lh

      - name: Extract Git Commits Log for Release Notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Extracting git log between $PREV_TAG and HEAD..."
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges "${PREV_TAG}..HEAD")
          else
            echo "First release tag. Extracting full commit log..."
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="* Maintenance release and performance updates."
          fi

          cat << EOF > release_body.md
          ## 🚀 TProxy Gateway Release ${RELEASE_TAG}

          Lightweight, high-performance, enterprise-grade dual-stack transparent proxy gateway with Zero-Allocation FakeIP, Single-Flight DNS, SWR caching, AdBlock filter, rule subscriptions, and embedded WebUI dashboard.

          ### 📝 Commits Changelog (${PREV_TAG:-Initial Release} -> ${RELEASE_TAG})
          ${CHANGELOG}

          ---

          ### 📦 Download Assets & Verify
          Verify downloaded binaries using \`checksums.txt\`:
          \`\`\`bash
          sha256sum -c checksums.txt
          \`\`\`

          ### 🚀 Quick Start
          **One-Click Install**:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/NNdroid/tproxy-gateway/main/scripts/install.sh | bash -s install
          \`\`\`
          EOF

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_COMMIT }}
          name: tproxy-gateway ${{ env.RELEASE_TAG }}
          body_path: release_body.md
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
