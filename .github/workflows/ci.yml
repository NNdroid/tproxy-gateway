name: Gateway validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Go tests including race detection
        run: go test -race -count=1 -timeout=120s ./...
      - name: Go vet
        run: go vet ./...
      - name: Dashboard tests
        run: node --test scripts/webui.test.cjs scripts/mcp-ui.test.cjs
      - name: Version and build script regression tests
        run: bash scripts/version.test.sh
      - name: Linux architecture builds
        run: |
          VERSION="$(bash scripts/version.sh)"
          for arch in amd64 arm64 mipsle; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=$VERSION" -o "$RUNNER_TEMP/tproxy-gateway-$arch" .
          done
          test "$("$RUNNER_TEMP/tproxy-gateway-amd64" --version)" = "$VERSION"
          test "$("$RUNNER_TEMP/tproxy-gateway-amd64" -version)" = "$VERSION"
