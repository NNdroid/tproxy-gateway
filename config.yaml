# =====================================================================
# TProxy Gateway 工业级核心配置文件 (高性能多分片分流网关)
# 适用系统: Debian / Ubuntu (需内核支持 IPv6 TProxy 与 Nftables)
# =====================================================================

# ---------------------------------------------------------------------
# 1. 全局日志配置 (Log Configuration)
# ---------------------------------------------------------------------
log:
  # 日志级别
  # 可选值: 
  #   - "debug": 调试模式。会打印每一个 TCP/UDP 链接的域名匹配、代理拨号、DNS 洗牌详情。大流量下会有轻微性能损耗。
  #   - "info" : 生产模式。仅打印网关启动、上游异常、配置加载等关键信息。日常运行推荐。
  #   - "warn" : 警告模式。仅记录拨号失败、解析失败等异常。
  #   - "error": 错误模式。仅记录导致程序局部崩溃的致命错误。
  level: "info"

# ---------------------------------------------------------------------
# 2. 本机监听服务配置 (Inbound Server Settings)
# ---------------------------------------------------------------------
server:
  # FakeIP DNS 服务的 UDP 监听地址
  #   - 格式为 "IP:端口"，若省略 IP（如 ":5353"）则代表监听本机所有 IPv4 和 IPv6 接口。
  #   - 客户端（或局域网下游设备）需将 DNS 第一服务器指向该地址。
  dns_addr: ":5353"

  # 透明代理 (TProxy) 流量的劫持监听地址
  #   - 必须使用 IPv6 监听格式 "[::]:端口"，程序内部会自动开启 IPV6_TRANSPARENT 选项。
  #   - 开启后，不仅能无缝接管 IPv6 流量，底层的 Linux 内核也会将 IPv4 流量自动映射通过该双栈端口。
  tproxy_addr: "[::]:10800"

# ---------------------------------------------------------------------
# 3. 全局路由策略与网络自动化 (Routing & Network Automation)
# ---------------------------------------------------------------------
routing:
  # 兜底分流策略 (当客户端请求的域名在下方 "rules" 规则树中完全没有命中时采取的默认动作)
  # 可选值:
  #   - "REJECT"          : 强行拦截并拒绝连接。多 Overlay 网络环境下防止隐私或内网域名泄漏的首选。
  #   - "DIRECT"          : 绕过代理，直接通过本机默认物理网卡发起直连。
  #   - "SOCKS5 代理地址"  : 例如 "127.0.0.1:1080"，未匹配的流量全部默认走该代理。
  default_upstream: "REJECT"

  # 默认远程上游 DNS (用于规则命中 "DIRECT" 或代理需要 IP 降级解析时的远程真实解析)
  #   - 内部包含高性能并发 A/AAAA 查询引擎，符合 Happy Eyeballs 精神，且内置 1~5 分钟的动态缓存。
  #   - 支持协议格式:
  #       - DoH (HTTPS) : "doh://1.1.1.1/dns-query?sni=cloudflare-dns.com" (常驻长连接复用，首选)
  #       - DoT (TLS)   : "dot://8.8.8.8:853?sni=dns.google"
  #       - 传统 TCP/UDP : "tcp://114.114.114.114:53" 或 "udp://223.5.5.5:53"
  default_dns: "doh://223.5.5.5/dns-query?sni=dns.alidns.com"

  # 自动路由与系统防火墙托管开关 (内核级自动化)
  #   - 设为 true 时：Go 主程序在启动时会自动下发 ip6 rule/route 策略路由，并通过标准输入流
  #     动态组装 nftables 规则灌入系统内核；程序安全退出（或接收到 Ctrl+C）时会自动将环境擦除干净，实现零残留。
  #   - 设为 false 时：用户需要手动在系统里配置 nftables 和 ip rule。
  auto_route: true

  # 策略路由防火墙标记位 (Firewall Mark)
  #   - 当 auto_route 为 true 时生效。用于标记需要被透明代理劫持的数据包。
  #   - 如果系统里跑了别的高级网络软件（如其它代理、多WAN负载均衡），若有冲突可随意更改为 1-65535 之间的数字。
  fwmark: 88

  # 自定义策略路由表 ID (Routing Table ID)
  #   - 当 auto_route 为 true 时生效。程序会把 local 本地解析路由绑定在这个独立的表 ID 中。
  #   - 如果系统内 table 1 已经被占用，可随意改成 1-255 之间的空闲表 ID。
  table: 88

  # 托管的 Nftables 表名称 (Nftables Table Name)
  #   - 当 auto_route 为 true 时生效。程序会在 inet 簇下建立该名称的独立防火墙表。
  #   - 动态生成的 nftables 规则会自动遍历下方 fake_ip.cidrs 中的每一个网段，进行精准 TProxy 强推。
  nft_table: "my_custom_overlay_table"

# ---------------------------------------------------------------------
# 4. FakeIP 资源池与多 VPN 映射配置 (FakeIP Pool Settings)
# ---------------------------------------------------------------------
fake_ip:
  # 核心进阶：支持配置任意多个独立的 IPv6 虚拟分流网段
  #   - 场景：当你服务器接入了多个不同的 Overlay VPN (如 Yggdrasil, Reticulum 或自建虚拟网)，
  #     只需把这些 VPN 接口对应的本地接收网段全部写在下面。
  #   - 运行机制：DNS 服务器在被查询时，会同时在以下所有网段中各提取一个未使用的 FakeIP，
  #     并在传回给客户端的 AAAA 记录列表前执行【随机打散洗牌（Shuffle）】。
  #   - 优势：哪怕客户端当前只接通了其中一个 VPN 接口，也有极高概率首选到正确的网段，其余没连的网段通过网络栈直回不可达，传统 App 绝不卡顿。
  cidrs:
    - "fd00:6464::/64"
    - "201:b008:9e72::/48"

  # FakeIP 映射记录的内存缓存存活时间 (Time To Live)
  #   - 当某个 FakeIP 映射建立后，如果在该时间段内没有任何客户端流量撞击网关，该记录会被高并发分步锁后台任务安全拔除。
  #   - 格式支持 Go 语言时间单位: "h" (小时), "m" (分钟), "s" (秒)。
  ttl: "2h"

  # 内存映射关系持久化落盘文件
  #   - 每 5 秒通过高性能原子 atomic.Bool 标志位进行无锁判定。如果内存中的域名-IP对发生变动，
  #     会异步写入 `.tmp` 临时文件并执行内核级 `Rename` 覆盖，防止网关重启或断电导致客户端现有 TCP 连接断开。
  persist_file: "fakeip.json"

# ---------------------------------------------------------------------
# 5. 分流规则块 (基于 Trie 树字典树的高性能后缀匹配)
# ---------------------------------------------------------------------
rules:
  # =================================================================
  # 【规则样例 A】：匹配域名走指定的上游 SOCKS5 代理节点
  # =================================================================
  - proxy: "127.0.0.1:1080"
    # 支持标准的 SOCKS5 地址。如果代理需要密码，格式支持: "user:password@127.0.0.1:1080"
    domains:
      - "google.com"   # 会自动递归后缀匹配所有子域名，如 mail.google.com, www.google.com 均会命中
      - "youtube.com"
      - "github.com"
      - "x.com"

  # =================================================================
  # 【规则样例 B】：匹配域名强制绕过代理，走本地网络直连
  # =================================================================
  - proxy: "DIRECT"
    # 使用大写的 "DIRECT" 关键字。命中后，网关会通过 default_dns 并发解析出物理公网 IP 并直接投递流量。
    domains:
      - "baidu.com"
      - "bilibili.com"
      - "apple.com"

  # =================================================================
  # 【规则样例 C】：匹配高级暗网/私有网域名，并支持高级 HTTP 头部重写
  # =================================================================
  - proxy: "127.0.0.1:4447"
    domains:
      - "zzz.i2p"
    # 针对 HTTP (标准 80 端口) 流量的流式高级修改
    # 当 TCP 流量撞击 80 端口且规则命中时，网关会在底层在零拷贝状态下通过 textproto 框架
    # 动态擦除并重写对应的 HTTP 请求头（常用于 Tor/I2P 等对 Host 敏感的本地出站代理）。
    header_rewrite:
      "Host": "zzz.i2p"
      "Connection": "close"
      "X-TProxy-Gateway": "Optimized-v3" # 你甚至可以自己加自定义的 Header