# =====================================================================
# TProxy Gateway 工业级核心配置文件 (高性能多分片分流网关)
# 适用系统: Debian / Ubuntu (需内核支持 IPv4/IPv6 TProxy 与 Nftables)
# =====================================================================

# ---------------------------------------------------------------------
# 1. 全局日志配置 (Log Configuration)
# ---------------------------------------------------------------------
log:
  # 日志级别: "debug" | "info" | "warn" | "error"
  level: "info"

# ---------------------------------------------------------------------
# 2. Prometheus 监控与 Web 控制台 (Metrics & WebUI Configuration)
# ---------------------------------------------------------------------
metrics:
  # 是否开启 Prometheus 性能指标监控与 REST API 服务
  enabled: true
  # 监听地址 (可访问 http://IP:9090/metrics 或 http://IP:9090/api/state)
  addr: ":9090"

ui:
  # 是否开启 WebUI 现代化图形控制台
  enabled: true
  # WebUI 工作模式: "port" (仅物理端口) | "domain" (仅 TProxy 虚拟域名, 零暴露端口) | "both" (两者均有效)
  mode: "both"
  # 可选：独立 HTTP 监听端口 (在 port 或 both 模式下生效)
  addr: ":9090"
  # 可选：自定义虚拟域名访问 WebUI (在 domain 或 both 模式下生效，如访问 http://dashboard.gateway/)
  domain: "dashboard.gateway"
  # 可选：WebUI 控制台登录密码 / REST API Token (留空或不填则免密访问)
  secret: "admin123"

# ---------------------------------------------------------------------
# 3. 本机监听服务配置 (Inbound Server Settings)
# ---------------------------------------------------------------------
server:
  # FakeIP DNS 服务的 UDP/TCP 监听地址 (客户端指向该 DNS 地址)
  dns_addr: ":5353"

  # 透明代理 (TProxy) 流量的劫持监听地址
  tproxy_addr: "[::]:10800"

  # 可选：SOCKS5 入口代理监听端口 (便于局域网非 TProxy 设备接入)
  socks_addr: ":1080"

  # 可选：HTTP 入口代理监听端口 (便于局域网浏览器接入)
  http_addr: ":8080"

# ---------------------------------------------------------------------
# 4. 全局路由策略与网络自动化 (Routing & Network Automation)
# ---------------------------------------------------------------------
routing:
  # 兜底分流策略: "REJECT" | "DIRECT" | 代理组名称 | SOCKS5地址
  default_upstream: "REJECT"

  # 默认远程上游 DNS (用于直连域名解析，支持 doq://, doh://, dot://, udp://)
  default_dns: "doh://223.5.5.5/dns-query?sni=dns.alidns.com"

  # 自动路由与系统双栈防火墙托管开关
  auto_route: true

  # 策略路由防火墙标记位 (Firewall Mark)
  fwmark: 88

  # 自定义策略路由表 ID (Routing Table ID)
  table: 88

  # 托管的 Nftables 表名称
  nft_table: "my_custom_overlay_table"

# ---------------------------------------------------------------------
# 5. FakeIP 资源池配置 (支持 IPv4 & IPv6 双栈网段)
# ---------------------------------------------------------------------
fake_ip:
  # 支持配置任意多个独立的 IPv4 / IPv6 虚拟分流网段
  cidrs:
    - "198.18.0.0/15"    # IPv4 FakeIP 网段
    - "fd00:6464::/64"   # IPv6 FakeIP 网段
    - "201:b008:9e72::/48"

  # FakeIP 映射记录的内存缓存存活时间 (Time To Live)
  ttl: "2h"

  # 内存映射关系持久化落盘文件
  persist_file: "fakeip.json"

# ---------------------------------------------------------------------
# 6. 🛡️ AdBlock 广告与恶意域名拦截配置 (AdBlocker Settings)
# ---------------------------------------------------------------------
adblock:
  enabled: true
  # 远程 Hosts / 域名黑名单下载地址
  urls:
    - "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
  # 本地 Hosts / 域名黑名单文件
  files:
    - "adblock_custom.txt"

# ---------------------------------------------------------------------
# 7. 🔄 远程分流规则订阅与自动热更新 (Subscriptions Settings)
# ---------------------------------------------------------------------
subscriptions:
  - name: "gfwlist"
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.txt"
    interval: "12h"

# ---------------------------------------------------------------------
# 8. 代理组与健康检查配置 (Proxy Groups & Health Check)
# ---------------------------------------------------------------------
proxy_groups:
  # 自动选取最低延迟节点的代理组
  - name: "auto-proxy"
    type: "url-test"      # "url-test" | "fallback"
    proxies:
      - "127.0.0.1:1080"
      - "127.0.0.1:1081"
    url: "http://cp.cloudflare.com/generate_204"
    interval: "30s"

  # 主备自动故障转移代理组
  - name: "backup-group"
    type: "fallback"
    proxies:
      - "127.0.0.1:1080"
      - "127.0.0.1:1082"
    url: "http://cp.cloudflare.com/generate_204"
    interval: "30s"

# ---------------------------------------------------------------------
# 9. 多维分流规则块 (Multi-Type Routing Rules)
# ---------------------------------------------------------------------
rules:
  # 【规则 1】：按域名后缀匹配走代理组
  - type: "DOMAIN-SUFFIX"
    payload: "google.com"
    proxy: "auto-proxy"

  - type: "DOMAIN-SUFFIX"
    payload: "github.com"
    proxy: "auto-proxy"

  # 【规则 2】：按域名关键字匹配走直连
  - type: "DOMAIN-KEYWORD"
    payload: "baidu"
    proxy: "DIRECT"

  # 【规则 3】：按目标 IP-CIDR 网段匹配走直连
  - type: "IP-CIDR"
    payload: "192.168.0.0/16"
    proxy: "DIRECT"

  # 【规则 4】：内网私有 IP (PRIVATE) 强制直连
  - type: "GEOIP"
    payload: "PRIVATE"
    proxy: "DIRECT"

  # 【规则 5】：暗网/Overlay 域名通用分流与 User-Agent 请求头重写
  - type: "DOMAIN-SUFFIX"
    payload: "i2p"
    proxy: "http://127.0.0.1:4444"
    header_rewrite:
      "User-Agent": "MYOB/6.66 (AN/ON)"
      "Connection": "close"

  # 【规则 6】：兜底规则 (Match All)
  - type: "MATCH"
    proxy: "REJECT"